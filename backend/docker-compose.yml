services:
  db:
    image: postgres:16
    container_name: chgkuli_db
    environment:
      POSTGRES_USER: chgkuli
      POSTGRES_PASSWORD: chgkuli
      POSTGRES_DB: chgkuli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chgkuli"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: